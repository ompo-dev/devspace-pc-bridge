[package]
name = "devspace-pc-bridge"
version = "0.4.0"
edition = "2021"
description = "Connect normal ChatGPT and Claude chats to your Windows PC via remote MCP"
license = "MIT"
repository = "https://github.com/ompo-dev/devspace-pc-bridge"

[[bin]]
name = "DevSpacePCBridge"
path = "src/main.rs"

[dependencies]
crossterm = "0.29"
ratatui = "0.30.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
