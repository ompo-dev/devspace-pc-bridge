[package]
name = "devspace-pc-bridge"
version = "0.2.0"
edition = "2021"
description = "Windows DevSpace MCP setup in a single Rust terminal executable"
license = "MIT"
repository = "https://github.com/ompo-dev/devspace-pc-bridge"

[[bin]]
name = "DevSpacePCBridge"
path = "src/main.rs"

[dependencies]
crossterm = "0.29"
ratatui = "0.30.2"
serde_json = "1"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
