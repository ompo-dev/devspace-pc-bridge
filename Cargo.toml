[package]
name = "devspace-pc-bridge"
version = "0.3.0"
edition = "2021"
description = "Windows DevSpace MCP setup in a single Rust terminal executable"
license = "MIT"
repository = "https://github.com/ompo-dev/devspace-pc-bridge"

[[bin]]
name = "DevSpacePCBridge"
path = "src/main.rs"

[dependencies]
crossterm = "0.29"
ratatui = "0.30.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
keyring = { version = "3.6", default-features = false, features = ["windows-native"] }
zeroize = "1"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
