[package]
name = "devspace-pc-bridge"
version = "0.5.0"
edition = "2021"
description = "Connect normal ChatGPT and Claude chats to your Windows PC via remote MCP"
license = "MIT"
repository = "https://github.com/ompo-dev/devspace-pc-bridge"

[[bin]]
name = "DevSpacePCBridge"
path = "src/main.rs"

[dependencies]
crossterm = "0.29"
ratatui = "0.30.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
tiny_http = "0.12.0"
sha2 = "0.11.1"
base64 = "0.23.1"
getrandom = "0.4.3"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[target."cfg(windows)".dependencies]
uiautomation = "0.25.1"
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Graphics_Dwm", "Win32_Storage_Xps", "Win32_System_Threading", "Win32_System_Console", "Win32_System_LibraryLoader", "Win32_System_Diagnostics_ToolHelp", "Win32_UI_WindowsAndMessaging", "Win32_UI_Shell", "Win32_UI_HiDpi", "Win32_UI_Input_KeyboardAndMouse"] }
