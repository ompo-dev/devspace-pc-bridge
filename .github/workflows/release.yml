name: Release Windows EXE
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  windows-release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: Swatinem/rust-cache@v2
      # The release only gets published if everything CI checks also passes here.
      - name: Script checks
        shell: pwsh
        run: ./tests/validate.ps1
      - name: Rust toolchain
        run: rustup component add rustfmt clippy
      - name: Format
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Test Rust application
        run: cargo test
      - name: Verify release tag matches Cargo version
        shell: pwsh
        run: |
          if ($env:GITHUB_REF_TYPE -ne 'tag') { throw 'Release requires a version tag vX.Y.Z' }
          if ($env:GITHUB_REF_NAME -notmatch '^v\d+\.\d+\.\d+$') { throw 'Invalid stable version tag' }
          $metadata = cargo metadata --no-deps --format-version 1 | ConvertFrom-Json
          $version = ($metadata.packages | Where-Object { $_.name -eq 'devspace-pc-bridge' }).version
          if ($env:GITHUB_REF_NAME -ne "v$version") { throw "Tag does not match Cargo.toml version $version" }
      - name: Build EXE
        run: cargo build --release
      - name: Install NSIS compiler
        shell: pwsh
        run: choco install nsis --yes --no-progress
      - name: Build unsigned installer
        shell: pwsh
        run: |
          $makensis = 'C:\Program Files (x86)\NSIS\makensis.exe'
          if (-not (Test-Path $makensis)) { throw 'NSIS compiler missing' }
          $version = $env:GITHUB_REF_NAME.TrimStart('v')
          & $makensis "/DAPP_VERSION=$version" 'packaging/DevSpacePCBridge.nsi'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Generate WinGet manifests
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME.TrimStart('v')
          ./packaging/generate-winget.ps1 -Version $version -InstallerPath './DevSpacePCBridge-Setup.exe'
          Compress-Archive -Path 'winget-manifests/manifests' -DestinationPath 'winget-manifests.zip'
      - name: Checksum
        shell: pwsh
        run: |
          foreach ($exe in @('target/release/DevSpacePCBridge.exe', 'DevSpacePCBridge-Setup.exe')) {
            $hash = (Get-FileHash -Algorithm SHA256 $exe).Hash.ToLower()
            "$hash  $(Split-Path -Leaf $exe)" | Set-Content -Encoding ascii "$exe.sha256"
          }
      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create $env:GITHUB_REF_NAME target/release/DevSpacePCBridge.exe target/release/DevSpacePCBridge.exe.sha256 DevSpacePCBridge-Setup.exe DevSpacePCBridge-Setup.exe.sha256 winget-manifests.zip --title "DevSpace PC Bridge $env:GITHUB_REF_NAME" --generate-notes --verify-tag
