name: Windows checks
on:
  push:
  pull_request:
jobs:
  syntax-and-tests:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - name: Syntax and offline checks
        shell: pwsh
        run: ./tests/validate.ps1
  rust-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: Swatinem/rust-cache@v2
      - name: Rust toolchain
        run: |
          rustup component add rustfmt clippy
          rustc --version
          cargo --version
      - name: Format
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Rust tests
        run: cargo test
      - name: Build EXE
        run: cargo build --release
      - name: Smoke test EXE
        shell: pwsh
        run: |
          .\target\release\DevSpacePCBridge.exe --version
          if ($LASTEXITCODE -ne 0) { exit 1 }
          # No bridge is installed on the runner: 1 (unhealthy) is expected, a crash is not.
          .\target\release\DevSpacePCBridge.exe --doctor
          if ($LASTEXITCODE -notin 0, 1) { exit 1 }
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: Rust-Lockfile
          path: Cargo.lock
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: DevSpacePCBridge-Windows
          path: target/release/DevSpacePCBridge.exe
          if-no-files-found: error
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - name: Known vulnerabilities in dependencies
        run: cargo audit
